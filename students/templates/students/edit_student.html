{% load static %}

<!DOCTYPE html>
<html>
<head>

    <title>Edit Student</title>

    <link rel="stylesheet"
          href="{% static 'students/style.css' %}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Student Management
        </div>

        <div>
            <a href="{% url 'home' %}">Dashboard</a>
            <a href="{% url 'students' %}">Students</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>

    </nav>

    <div class="container">

        <div class="form-card">

            <h1>Edit Student</h1>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn" type="submit">
                    Update Student
                </button>

                <a class="btn"
                   href="{% url 'students' %}">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</body>
</html>
