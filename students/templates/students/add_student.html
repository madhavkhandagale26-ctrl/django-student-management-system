{% load static %}

<!DOCTYPE html>
<html>
<head>

    <title>Add Student</title>

    <link rel="stylesheet"
          href="{% static 'students/style.css' %}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Student Management
        </div>

        <div>
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'add_student' %}">Add Student</a>
    <a href="{% url 'students' %}">Students</a>
    <a href="{% url 'logout' %}">Logout</a>
</div>

    </nav>


    <div class="container">

        <div class="form-card">

            <h1>Add Student</h1>

            {% if error %}
    <p style="color: red; margin-bottom: 15px;">
        {{ error }}
    </p>
{% endif %}

            <form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button class="btn" type="submit">
        Add Student
    </button>

    <a class="btn" href="{% url 'students' %}">
        Cancel
    </a>

</form>

        </div>

    </div>

</body>
</html>
