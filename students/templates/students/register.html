{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Register - Student Management</title>

    <link rel="stylesheet"
          href="{% static 'students/style.css' %}">

</head>

<body>

<div class="container">

    <div class="form-card">

        <h1>Create Account</h1>

        {% if error %}
            <p style="color: red;">
                {{ error }}
            </p>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter email"
                    required
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>

            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    required
                >

            </div>

            <button class="btn" type="submit">
                Register
            </button>

        </form>

        <br>

        <p>
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>

    </div>

</div>

</body>
</html>
