{% load static %}

<!DOCTYPE html>
<html>
<head>

    <title>Delete Student</title>

    <link rel="stylesheet"
          href="{% static 'students/style.css' %}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Student Management
        </div>

        <div>
            <a href="{% url 'home' %}">Dashboard</a>
            <a href="{% url 'students' %}">Students</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>

    </nav>

    <div class="container">

        <div class="form-card">

            <h1>Delete Student</h1>

            <p>
                Are you sure you want to delete
                <strong>{{ student.name }}</strong>?
            </p>

            <br>

            <form method="POST">

                {% csrf_token %}

                <button class="btn btn-danger" type="submit">
                    Yes, Delete
                </button>

                <a class="btn"
                   href="{% url 'students' %}">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</body>
</html>
